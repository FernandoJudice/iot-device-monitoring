name: moura-connect-base

services:
  mongo:
    image: mongo:7
    container_name: mc-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mc-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mc-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: mc-kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 12

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: mc-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic telemetria.leituras --partitions 6 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic alertas.eventos --partitions 3 --replication-factor 1
      echo '[kafka-init] topicos prontos:'
      kafka-topics --bootstrap-server kafka:29092 --list
      "

  simulador:
    build: ./simulador
    container_name: mc-simulador
    depends_on:
      mosquitto:
        condition: service_started
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      INTERVALO_MS: "5000"
      SEMENTE: "42"
    restart: unless-stopped
  
  ingestao:
    build: ./ingestao
    container_name: ingestao
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
    environment:
      MQTT_BROKER: mqtt://mosquitto:1883
      BATTERY_BANK_TOPIC: "moura/telemetria"
      KAFKA_BROKER: "kafka:29092"
      INGESTION_TOPIC: "telemetria.leituras"
  
  processamento:
    build: ./processamento
    container_name: processamento
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BROKER: "kafka:29092"
      KAFKA_INGESTION_TOPIC: "telemetria.leituras"
      KAFKA_ALARM_TOPIC: "alertas.eventos"
      MONGODB_URI: "mongodb://mongo:27017/moura"
      REDIS_URL: "redis://redis:6379"
      DISCHARGE_TIME_MIN: 1
      OVERTEMP_C: 30
      LOW_VOLTAGE_V: 50

volumes:
  mongo-data:
